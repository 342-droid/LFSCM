<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 供货关系</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-product.css">
    <link rel="stylesheet" href="../css/master-data-brand.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/master-data-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="product-page master-data-brand-page">
                <div class="product-page-body">
                    <section class="erp-page__card master-data-supply">
                        <div class="mdb-toolbar">
                            <span class="mdb-toolbar__title">供货关系</span>
                            <button type="button" class="mdb-btn mdb-btn--primary" id="supplyAddBtn">+ 新增供货关系</button>
                        </div>
                        <div class="mdb-pane">
                            <form class="mdb-query" id="supplyQueryForm">
                                <label class="mdb-query__field">SPU编码
                                    <input type="text" id="supplyQuerySpu" placeholder="请输入SPU编码" autocomplete="off">
                                </label>
                                <label class="mdb-query__field">货号
                                    <input type="text" id="supplyQuerySku" placeholder="请输入货号" autocomplete="off">
                                </label>
                                <label class="mdb-query__field">货品名称
                                    <input type="text" id="supplyQueryName" placeholder="请输入货品名称" autocomplete="off">
                                </label>
                                <label class="mdb-query__field">货品条码
                                    <input type="text" id="supplyQueryBarcode" placeholder="请输入货品条码" autocomplete="off">
                                </label>
                                <label class="mdb-query__field">供应商
                                    <input type="text" id="supplyQuerySupplier" placeholder="请输入供应商名称" autocomplete="off">
                                </label>
                                <label class="mdb-query__field">经营方式
                                    <select id="supplyQueryOperate">
                                        <option value="">全部</option>
                                        <option value="代采代销">代采代销</option>
                                        <option value="购销">购销</option>
                                        <option value="联营">联营</option>
                                    </select>
                                </label>
                                <label class="mdb-query__field">价格状态
                                    <select id="supplyQueryPrice">
                                        <option value="">全部</option>
                                        <option value="未核价">未核价</option>
                                        <option value="已核价">已核价</option>
                                    </select>
                                </label>
                                <label class="mdb-query__field">样品状态
                                    <select id="supplyQuerySample">
                                        <option value="">全部</option>
                                        <option value="待检">待检</option>
                                        <option value="合格">合格</option>
                                        <option value="无需样品">无需样品</option>
                                    </select>
                                </label>
                                <label class="mdb-query__field">状态
                                    <select id="supplyQueryStatus">
                                        <option value="">全部</option>
                                        <option value="active">启用</option>
                                        <option value="disabled">停用</option>
                                    </select>
                                </label>
                                <div class="mdb-query__actions">
                                    <button type="submit" class="mdb-btn mdb-btn--primary">查询</button>
                                    <button type="button" class="mdb-btn mdb-btn--ghost" id="supplyQueryReset">重置</button>
                                </div>
                            </form>
                            <div class="mdb-table-wrap">
                                <table class="mdb-table">
                                    <thead>
                                        <tr>
                                            <th>供应商编码</th>
                                            <th>供应商</th>
                                            <th>货品名称</th>
                                            <th>SPU编码</th>
                                            <th>货号</th>
                                            <th>货品条码</th>
                                            <th>保质期</th>
                                            <th>温层</th>
                                            <th>商品图片</th>
                                            <th>经营方式</th>
                                            <th>标准采购价</th>
                                            <th>标准采购单位</th>
                                            <th>采购核定价</th>
                                            <th>实际采购单位</th>
                                            <th>最小起订量</th>
                                            <th>价格状态</th>
                                            <th>样品状态</th>
                                            <th>是否主供应商</th>
                                            <th>状态</th>
                                            <th class="mdb-table__op">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="supplyTableBody"></tbody>
                                </table>
                            </div>
                            <div class="product-pagination" id="supplyPagination">
                                <span id="supplyPaginationTotal">共 0 条</span>
                                <div class="product-pagination__right">
                                    <select class="product-pagination__size" id="supplyPageSize" aria-label="每页条数">
                                        <option value="20" selected>20条/页</option>
                                        <option value="50">50条/页</option>
                                        <option value="100">100条/页</option>
                                    </select>
                                    <div class="product-pagination__pages" id="supplyPaginationPages"></div>
                                    <label class="product-pagination__goto">
                                        前往
                                        <input id="supplyPageGoto" type="text" value="1" inputmode="numeric" aria-label="前往页码">
                                        页
                                    </label>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/master-data-units.js"></script>
    <script src="../js/master-data-category-store.js"></script>
    <script src="../js/master-data-library.js"></script>
    <script src="../js/master-data-supplier-store.js"></script>
    <script src="../js/master-data-supply-store.js"></script>
    <script src="../js/master-data-supply.js"></script>
</body>
</html>
