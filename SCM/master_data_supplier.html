<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冷丰WMS - 供应商档案</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/lf-mdm-from-master.css">
    <link rel="stylesheet" href="../css/lf-product.css">
    <link rel="stylesheet" href="../css/master-data-brand.css">
</head>
<body>
    <div id="sidebar-container"></div>
    <script src="../js/path-prefix.js"></script>
    <script src="../js/master-data-sidebar.js"></script>
    <div id="header-container"></div>
    <div class="container">
        <main class="main-content">
            <div class="product-page master-data-brand-page">
                <div class="product-page-body">
                    <section class="erp-page__card master-data-supplier">
                        <div class="mdb-toolbar">
                            <span class="mdb-toolbar__title">供应商档案</span>
                            <button type="button" class="mdb-btn mdb-btn--primary" id="supplierAddBtn">+ 新增供应商</button>
                        </div>
                        <div class="mdb-pane">
                            <form class="mdb-query" id="supplierQueryForm">
                                <label class="mdb-query__field">供应商名称
                                    <input type="text" id="supplierQueryName" placeholder="请输入供应商名称" autocomplete="off">
                                </label>
                                <label class="mdb-query__field">状态
                                    <select id="supplierQueryStatus">
                                        <option value="">全部</option>
                                        <option value="active">启用</option>
                                        <option value="disabled">停用</option>
                                    </select>
                                </label>
                                <div class="mdb-query__actions">
                                    <button type="submit" class="mdb-btn mdb-btn--primary">查询</button>
                                    <button type="button" class="mdb-btn mdb-btn--ghost" id="supplierQueryReset">重置</button>
                                </div>
                            </form>
                            <div class="mdb-table-wrap">
                                <table class="mdb-table">
                                    <thead>
                                        <tr>
                                            <th>供应商编码</th>
                                            <th>供应商名称</th>
                                            <th>供应商类型</th>
                                            <th>业务联系人</th>
                                            <th>业务联系电话</th>
                                            <th>仓库联系人</th>
                                            <th>仓库联系电话</th>
                                            <th>省市区</th>
                                            <th>详细地址</th>
                                            <th>状态</th>
                                            <th class="mdb-table__op">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="supplierTableBody"></tbody>
                                </table>
                            </div>
                            <div class="product-pagination" id="supplierPagination">
                                <span id="supplierPaginationTotal">共 0 条</span>
                                <div class="product-pagination__right">
                                    <select class="product-pagination__size" id="supplierPageSize" aria-label="每页条数">
                                        <option value="20" selected>20条/页</option>
                                        <option value="50">50条/页</option>
                                        <option value="100">100条/页</option>
                                    </select>
                                    <div class="product-pagination__pages" id="supplierPaginationPages"></div>
                                    <label class="product-pagination__goto">
                                        前往
                                        <input id="supplierPageGoto" type="text" value="1" inputmode="numeric" aria-label="前往页码">
                                        页
                                    </label>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/mdm-store-region-cascader.js"></script>
    <script src="../js/master-data-supplier-store.js"></script>
    <script src="../js/master-data-supplier.js"></script>
</body>
</html>
